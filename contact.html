<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Rishabh</title>
    <link rel="stylesheet" href="cloudflare.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        
        header {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 15px 8%; background: rgba(11, 15, 25, 0.75); backdrop-filter: blur(16px); z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logo-container video { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #3b82f6; }
        header ul { display: flex; list-style: none; gap: 35px; }
        header ul li a { color: #94a3b8; text-decoration: none; font-weight: 600; transition: 0.3s; }
        header ul li a:hover, header ul li a.active { color: #3b82f6; }

        main { flex: 1; padding: 160px 8% 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        h2 { font-size: 3.2rem; font-weight: 800; color: #fff; margin-bottom: 15px; letter-spacing: -1px; }
        h2 span { color: #3b82f6; }
        .contact-subtitle { color: #94a3b8; margin-bottom: 45px; font-size: 1.15rem; max-width: 500px; }

        .contact-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.6));
            padding: 50px 40px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 480px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }
        .contact-card:hover { transform: scale(1.01); }
        
        .phone-wrapper { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .phone-icon { color: #3b82f6; font-size: 1.6rem; }
        .phone-number { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        
        .call-btn {
            display: inline-flex; align-items: center; gap: 10px; justify-content: center; background: #3b82f6;
            color: white; padding: 16px 40px; border-radius: 14px; text-decoration: none; font-weight: 600;
            font-size: 1.05rem; transition: all 0.3s ease; width: 100%;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.25);
        }
        .call-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.45); }

        footer { text-align: center; padding: 30px; color: #475569; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.03); background: #070a12; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container"><video src="Rishabh.mp4" autoplay loop muted playsinline></video></div>
        <ul>
            <li><a href="index.html">home</a></li>
            <li><a href="about.html">about</a></li>
            <li><a href="skills.html">skills</a></li>
            <li><a href="contact.html" class="active">contact</a></li>
        </ul>
    </header>

    <main>
        <h2>Initiate <span>Contact</span></h2>
        <p class="contact-subtitle">Have an opening, a code challenge, or need project consultation? Let's initiate a conversation sync.</p>
        
        <div class="contact-card">
            <div class="phone-wrapper">
                <i class="fa-solid fa-phone-volume phone-icon"></i>
                <span class="phone-number">7276777656</span>
            </div>
            <a href="tel:7276777656" class="call-btn"><i class="fa-solid fa-headset"></i> Establish Audio Line</a>
        </div>
    </main>

    <footer>© 2026 Rishabh | Available for targeted project assignments</footer>
</body>
</html>
